<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vigil fixture extraction</title>
  </head>
  <body>
    <p id="status">loading...</p>
    <pre id="output" style="white-space: pre-wrap; word-break: break-all"></pre>
    <script type="module">
      import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

      // Keep in sync with src/lib/vision/landmarkIndices.ts
      const RIGHT_EYE = [33, 160, 158, 133, 153, 144];
      const LEFT_EYE = [362, 385, 387, 263, 373, 380];
      const EYE_INDICES = [...RIGHT_EYE, ...LEFT_EYE];

      const files = {
        open: ["source-photos/open-1.jpg", "source-photos/open-2.jpg", "source-photos/open-3.jpg"],
        closed: ["source-photos/closed-1.jpg", "source-photos/closed-2.jpg", "source-photos/closed-3.jpg"],
      };

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      async function main() {
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");
        const landmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          },
          runningMode: "IMAGE",
          numFaces: 1,
          outputFaceBlendshapes: false,
          outputFacialTransformationMatrixes: false,
        });

        const result = { open: [], closed: [] };
        for (const label of ["open", "closed"]) {
          for (const src of files[label]) {
            const img = await loadImage(src);
            const detection = landmarker.detect(img);
            const landmarks = detection.faceLandmarks?.[0];
            if (!landmarks) {
              result[label].push({ src, error: "no face detected" });
              continue;
            }
            const eyeLandmarks = {};
            for (const idx of EYE_INDICES) {
              eyeLandmarks[idx] = { x: Number(landmarks[idx].x.toFixed(6)), y: Number(landmarks[idx].y.toFixed(6)) };
            }
            result[label].push({ src, landmarks: eyeLandmarks });
          }
        }

        document.getElementById("status").textContent = "done";
        document.getElementById("output").textContent = JSON.stringify(result);
        window.__vigilFixtureResult = result;
      }

      main().catch((err) => {
        document.getElementById("status").textContent = "error: " + err;
        console.error(err);
      });
    </script>
  </body>
</html>
